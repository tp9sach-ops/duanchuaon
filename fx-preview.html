<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Xem thử hiệu ứng chiêu 3D — Diệu Giang Tự</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080d; color: #f6e7c1; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #bang { position: fixed; left: 8px; top: 8px; max-width: min(340px, 92vw); padding: 10px 12px; border-radius: 12px; background: rgba(20, 14, 8, .86); border: 1px solid rgba(241, 219, 159, .6); }
  #bang h1 { margin: 0 0 6px; font-size: 15px; }
  #bang label { display: block; margin: 6px 0 0; font-size: 12px; }
  #bang input[type=range] { width: 100%; }
  #bang button { margin: 6px 6px 0 0; padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(241, 219, 159, .6); background: rgba(60, 42, 20, .9); color: #fff; font: inherit; cursor: pointer; }
  #st { margin-top: 8px; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  #st.ok { color: #9be39b; } #st.loi { color: #ff8a80; }
  #fps { position: fixed; right: 10px; top: 8px; font-size: 12px; opacity: .8; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="bang">
  <h1>Xem thử hiệu ứng chiêu 3D</h1>
  <div>Kéo để xoay · cuộn/chụm để zoom. Mục 1: lửa thật (khối lửa shader + khói + tàn lửa + vũng sáng).</div>
  <label>Nhiệt độ lửa <input id="heat" type="range" min="0.5" max="1.6" step="0.01" value="1"></label>
  <label>Độ đục <input id="pow" type="range" min="0.3" max="1.6" step="0.01" value="1"></label>
  <label>Số hạt tàn lửa <input id="ham" type="range" min="0" max="400" step="10" value="160"></label>
  <button id="b-khoi" type="button">Bật/tắt khói</button><button id="b-vung" type="button">Bật/tắt vũng sáng</button>
  <div id="st">Đang khởi động…</div>
</div>
<div id="fps"></div>
<script type="module" src="js/fxPreview.js"></script>
</body>
</html>
